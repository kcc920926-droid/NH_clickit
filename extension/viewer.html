<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CaptureIT QA Viewer</title>
  <link rel="stylesheet" href="viewer.css">
</head>
<body>
  <header>
    <img src="icons/captureit-icon-48.png" alt="" width="38" height="38">
    <div><h1>CaptureIT QA Viewer</h1><p>ZIP을 브라우저 내부에서 읽기 전용으로 표시합니다.</p></div>
    <label class="file-button">ZIP 열기<input id="package-input" type="file" accept=".zip,application/zip" hidden></label>
  </header>
  <main id="drop-zone">
    <section id="empty-state">
      <strong>CaptureIT ZIP을 여기에 놓으세요.</strong>
      <span>report.html을 우선 표시하고 report.md로 대체합니다.</span>
    </section>
    <p id="viewer-message" role="status"></p>
    <iframe id="report-frame" title="CaptureIT QA 보고서" sandbox="" referrerpolicy="no-referrer" hidden></iframe>
  </main>
  <script src="shared/zip.js"></script>
  <script src="shared/viewer.js"></script>
  <script src="viewer.js"></script>
</body>
</html>
