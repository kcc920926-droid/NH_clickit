<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OrderOps · 주문 승인</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand"><span>O</span> OrderOps</div>
    <nav aria-label="주 메뉴">
      <a href="#/dashboard">대시보드</a>
      <a class="active" href="#/orders">주문 관리 <strong>3</strong></a>
      <a href="#/customers">고객 관리</a>
      <a href="#/settings">설정</a>
    </nav>
    <div class="operator"><span>QA</span><div><b>김테스터</b><small>품질관리팀</small></div></div>
  </aside>

  <main>
    <header class="topbar">
      <div><span class="environment">TEST</span><span>폐쇄망 검증 환경</span></div>
      <time datetime="2026-07-06">2026.07.06</time>
    </header>
    <div id="app" class="content" aria-live="polite"></div>
  </main>

  <div id="success-toast" class="toast" role="status" hidden>
    <span aria-hidden="true">✓</span>
    <div><b>주문 승인이 완료되었습니다.</b><small>ORD-1002 상태가 승인 완료로 변경되었습니다.</small></div>
  </div>

  <template id="orders-template">
    <section class="page-heading">
      <div><p class="breadcrumb">주문 관리 / 승인 대기</p><h1>주문 승인</h1><p>결제 검증이 끝난 주문을 확인하고 승인합니다.</p></div>
      <button class="secondary" type="button">내보내기</button>
    </section>
    <section class="stats" aria-label="주문 현황">
      <article><span>승인 대기</span><strong>3</strong><small>전일 대비 +1</small></article>
      <article><span>오늘 승인</span><strong>18</strong><small>평균 처리 4분</small></article>
      <article><span>검토 필요</span><strong>1</strong><small>금액 한도 초과</small></article>
    </section>
    <section class="card">
      <div class="card-toolbar"><div><h2>승인 대기 주문</h2><p>결제 및 재고 확인이 완료된 건입니다.</p></div><input aria-label="주문 검색" placeholder="주문번호 또는 고객명 검색"></div>
      <table id="order-table">
        <thead><tr><th>주문번호</th><th>고객명</th><th>주문일시</th><th>결제금액</th><th>상태</th><th><span class="sr-only">작업</span></th></tr></thead>
        <tbody>
          <tr data-order-id="ORD-1001"><td><a href="#/orders/ORD-1001">ORD-1001</a></td><td>박서준</td><td>2026.07.06 09:42</td><td>₩128,000</td><td><span class="badge review">검토 필요</span></td><td><button class="secondary small" type="button">검토</button></td></tr>
          <tr class="focus-row" data-order-id="ORD-1002"><td><a href="#/orders/ORD-1002">ORD-1002</a><small class="priority">우선 처리</small></td><td>이하늘</td><td>2026.07.06 10:18</td><td>₩74,500</td><td><span id="order-status" class="badge pending">승인 대기</span></td><td><button id="approve-order" class="primary small" type="button">승인</button></td></tr>
          <tr data-order-id="ORD-1003"><td><a href="#/orders/ORD-1003">ORD-1003</a></td><td>최유진</td><td>2026.07.06 10:31</td><td>₩231,000</td><td><span class="badge pending">승인 대기</span></td><td><button class="primary small" type="button">승인</button></td></tr>
        </tbody>
      </table>
      <footer class="table-footer"><span>총 3건</span><span>1 / 1 페이지</span></footer>
    </section>
  </template>

  <template id="detail-template">
    <section class="page-heading"><div><p class="breadcrumb"><a href="#/orders">주문 관리</a> / ORD-1002</p><h1>ORD-1002</h1><p>주문 상세 및 승인 이력을 확인합니다.</p></div><a class="button secondary" href="#/orders">목록으로</a></section>
    <section class="detail-grid">
      <article class="card detail"><h2>주문 정보</h2><dl><div><dt>고객명</dt><dd>이하늘</dd></div><div><dt>결제금액</dt><dd>₩74,500</dd></div><div><dt>결제수단</dt><dd>법인카드</dd></div><div><dt>배송지</dt><dd>서울시 중구 세종대로</dd></div></dl></article>
      <article class="card detail"><h2>검증 상태</h2><ul class="checks"><li><span>✓</span>결제 승인 확인</li><li><span>✓</span>재고 할당 완료</li><li><span>✓</span>배송지 유효성 확인</li></ul><p class="notice">모든 사전 검증이 완료되었습니다.</p></article>
    </section>
  </template>

  <script src="app.js"></script>
</body>
</html>
